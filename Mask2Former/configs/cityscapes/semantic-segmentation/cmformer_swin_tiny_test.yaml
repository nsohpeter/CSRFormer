_BASE_: maskformer2_R50_bs16_90k.yaml

MODEL:
  BACKBONE:
    NAME: "D2SwinTransformer"
  SWIN:
    EMBED_DIM: 96
    DEPTHS: [2, 2, 6, 2]
    NUM_HEADS: [3, 6, 12, 24]
    WINDOW_SIZE: 7
    APE: False
    DROP_PATH_RATE: 0.3
    PATCH_NORM: True
  WEIGHTS: "pretrained_weights/swin_tiny_patch4_window7_224.pkl"
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]

SOLVER:
  IMS_PER_BATCH: 2
  BASE_LR: 0.00005
  MAX_ITER: 100
  WARMUP_ITERS: 10
  CHECKPOINT_PERIOD: 50

OUTPUT_DIR: "./output/cmformer_swin_tiny_TEST"

TEST:
  EVAL_PERIOD: 50

DATALOADER:
  NUM_WORKERS: 2

DATASETS:
  TRAIN: ("cityscapes_fine_sem_seg_train",)
  TEST: ("cityscapes_fine_sem_seg_val",)
