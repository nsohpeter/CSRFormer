_BASE_: ../../configs/cityscapes/semantic-segmentation/maskformer2_R50_bs16_90k.yaml

MODEL:
  BACKBONE:
    NAME: "D2SwinTransformer"
  SWIN:
    EMBED_DIM: 128
    DEPTHS: [2, 2, 18, 2]
    NUM_HEADS: [4, 8, 16, 32]
    WINDOW_SIZE: 12
    APE: False
    DROP_PATH_RATE: 0.3
    PATCH_NORM: True
    PRETRAIN_IMG_SIZE: 384
  WEIGHTS: ""  # Train from scratch (no pretrained weights)
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]

SOLVER:
  IMS_PER_BATCH: 4            # Batch size (same as CMFormer Swin-Base v2)
  BASE_LR: 0.00005            # Learning rate (same as CMFormer)
  BASE_LR_END: 0.0            # Decay to 0
  MAX_ITER: 90000             # Full training (90k iterations)
  WARMUP_ITERS: 1000          # Warmup period
  STEPS: (60000, 80000)       # LR decay milestones
  GAMMA: 0.1                  # LR decay factor
  LR_SCHEDULER_NAME: WarmupPolyLR
  CHECKPOINT_PERIOD: 5000     # Save checkpoint every 5k iterations
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
  AMP:
    ENABLED: True             # Automatic Mixed Precision

OUTPUT_DIR: "./experiments/training_outputs/baseline_mask2former_swinb_v1"

TEST:
  EVAL_PERIOD: 5000           # Evaluate every 5k iterations

DATALOADER:
  NUM_WORKERS: 4

INPUT:
  MIN_SIZE_TRAIN: (512, 768, 1024)
  MIN_SIZE_TEST: 1024
  CROP:
    ENABLED: True
    SIZE: (512, 1024)
