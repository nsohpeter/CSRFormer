_BASE_: ../../configs/cityscapes/semantic-segmentation/swin/maskformer2_swin_base_IN21k_384_bs16_90k.yaml

MODEL:
  WEIGHTS: "../pretrained_weights/swin_base_patch4_window12_384_22k.pth"

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.0001
  STEPS: (60000, 80000)
  GAMMA: 0.1
  MAX_ITER: 90000
  WARMUP_ITERS: 1500
  WARMUP_FACTOR: 0.001
  WARMUP_METHOD: "linear"
  WEIGHT_DECAY: 0.05
  OPTIMIZER: "ADAMW"
  BACKBONE_MULTIPLIER: 1.0  # Don't reduce backbone LR!
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
  AMP:
    ENABLED: True
  CHECKPOINT_PERIOD: 5000

OUTPUT_DIR: "./experiments/training_outputs/baseline_pretrained_v2"

DATALOADER:
  NUM_WORKERS: 4

DATASETS:
  TRAIN: ("cityscapes_fine_sem_seg_train",)
  TEST: ("cityscapes_fine_sem_seg_val",)

TEST:
  EVAL_PERIOD: 5000
